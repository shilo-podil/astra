<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra AI - הבוט שיודע הכל</title>
  <meta name="description" content="Astra AI - עוזר חכם שיודע הכל. כתיבה, קוד, לימוד, יצירה ועוד." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='66' font-family='Arial' font-size='58' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">A</div>
          <span>Astra AI</span>
        </div>
        <button class="icon-btn" id="closeSidebarBtn" title="סגור">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <button class="new-chat-main" id="newChatMain">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        שיחה חדשה
      </button>

      <div class="section-title">קטגוריות</div>
      <nav class="categories" id="categories">
        <button class="category active" data-category="general">
          <span class="cat-emoji">✨</span><span>כללי</span>
        </button>
        <button class="category" data-category="code">
          <span class="cat-emoji">💻</span><span>קוד ופיתוח</span>
        </button>
        <button class="category" data-category="writing">
          <span class="cat-emoji">✍️</span><span>כתיבה</span>
        </button>
        <button class="category" data-category="learning">
          <span class="cat-emoji">🎓</span><span>לימוד והבנה</span>
        </button>
        <button class="category" data-category="life">
          <span class="cat-emoji">🌱</span><span>חיים ויומיום</span>
        </button>
        <button class="category" data-category="business">
          <span class="cat-emoji">💼</span><span>עסקים ופרודקטיביות</span>
        </button>
        <button class="category" data-category="creative">
          <span class="cat-emoji">🎨</span><span>יצירה ורעיונות</span>
        </button>
        <button class="category" data-category="analysis">
          <span class="cat-emoji">📊</span><span>ניתוח ומחקר</span>
        </button>
      </nav>

      <div class="section-title">היסטוריה</div>
      <div class="history" id="history">
        <p class="empty-history">אין שיחות עדיין</p>
      </div>

      <div class="sidebar-footer">
        <button class="footer-btn" id="settingsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          הגדרות
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" title="תפריט">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Astra AI</div>
        <div class="model-pill"><span class="dot"></span>Astra • Smart</div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">A</div>
          <h1>שלום, אני <span class="grad">Astra</span></h1>
          <p class="subtitle">הבוט שיודע הכל. במה אוכל לעזור היום?</p>

          <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer">
        <div class="composer-inner">
          <textarea
            id="input"
            class="input"
            placeholder="שאל את Astra כל דבר..."
            rows="1"
          ></textarea>
          <div class="composer-actions">
            <span class="hint">Enter לשליחה • Shift+Enter לשורה חדשה</span>
            <button class="send-btn" id="sendBtn" title="שלח" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">Astra AI יכולה לטעות. בדוק מידע חשוב.</p>
      </footer>
    </main>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2>הגדרות</h2>
        <button class="icon-btn" data-close>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Anthropic API Key</span>
          <input id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off" />
          <small>המפתח נשמר רק בדפדפן שלך. השג מפתח ב-<a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.</small>
        </label>

        <label class="field">
          <span>שם תצוגה</span>
          <input id="userNameInput" type="text" placeholder="איך לקרוא לך?" />
        </label>

        <label class="field">
          <span>ערכת נושא</span>
          <select id="themeSelect">
            <option value="dark">כהה</option>
            <option value="light">בהיר</option>
          </select>
        </label>

        <div class="modal-actions">
          <button class="btn-secondary" data-close>ביטול</button>
          <button class="btn-primary" id="saveSettings">שמור</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
