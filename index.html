  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
    let deferredInstall = null;
    let installPrompted = false;
    function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
    function isMobile() { return /Android|iPad|iPhone|iPod|Mobile/i.test(navigator.userAgent); }
    function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }

    window.addEventListener('appinstalled', () => {
      localStorage.setItem('astra_installed', '1');
    });

    async function autoPromptInstall() {
      if (installPrompted) return;
      if (!deferredInstall) return;
      if (isStandalone()) return;
      if (localStorage.getItem('astra_installed')) return;
      installPrompted = true;
      try {
        deferredInstall.prompt();
        const r = await deferredInstall.userChoice;
        if (r.outcome === 'accepted') localStorage.setItem('astra_installed', '1');
      } catch {}
      deferredInstall = null;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      // Trigger install on next user interaction (browsers require user gesture)
      const handler = () => {
        autoPromptInstall();
        document.removeEventListener('click', handler, true);
        document.removeEventListener('touchend', handler, true);
        document.removeEventListener('keydown', handler, true);
      };
      document.addEventListener('click', handler, true);
      document.addEventListener('touchend', handler, true);
      document.addEventListener('keydown', handler, true);
    });

    function showIOSInstallGuide() {
      if (document.getElementById('iosGuide')) return;
      const guide = document.createElement('div');
      guide.id = 'iosGuide';
      guide.className = 'ios-guide';
      guide.innerHTML = `
        <div class="ios-guide-card">
          <button class="ios-close" aria-label="סגור">×</button>
          <div class="ios-guide-icon">
            <img src="apple-touch-icon.png" alt="Astra" width="72" height="72" style="border-radius:18px;display:block;" />
          </div>
          <h2>התקן את Astra באייפון</h2>
          <p class="ios-sub">תופיע במסך הראשי כמו ChatGPT, Netflix, ושאר האפליקציות</p>
          <div class="ios-step"><div class="ios-num">1</div><div class="ios-text">לחץ על <strong>כפתור השיתוף</strong> <svg width="18" height="22" viewBox="0 0 18 22" fill="none" style="vertical-align:middle"><path d="M9 1v13M4 6l5-5 5 5M2 9v10a2 2 0 002 2h10a2 2 0 002-2V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> בתחתית Safari</div></div>
          <div class="ios-step"><div class="ios-num">2</div><div class="ios-text">גלול ובחר <strong>"Add to Home Screen"</strong> 📱</div></div>
          <div class="ios-step"><div class="ios-num">3</div><div class="ios-text">לחץ <strong>"Add"</strong> בפינה הימנית עליונה</div></div>
          <button class="ios-got-it">הבנתי, בוא נתחיל</button>
        </div>
      `;
      document.body.appendChild(guide);
      const close = () => guide.remove();
      guide.querySelector('.ios-close').onclick = close;
      guide.querySelector('.ios-got-it').onclick = close;
      guide.onclick = (e) => { if (e.target === guide) close(); };
    }

    // iOS Safari can't auto-install - show beautiful inline guide once after splash
    if (isIOS() && !isStandalone() && !localStorage.getItem('astra_ios_seen')) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (isStandalone() || localStorage.getItem('astra_ios_seen')) return;
          localStorage.setItem('astra_ios_seen', '1');
          showIOSInstallGuide();
        }, 3500);
      });
    }
  </script>
